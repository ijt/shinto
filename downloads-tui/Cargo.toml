[package]
name = "shinto-downloads"
version = "0.1.0"
edition = "2021"
description = "Shinto's downloads view: a Ratatui TUI reading downloads.sqlite directly"

[[bin]]
name = "shinto-downloads"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 2
